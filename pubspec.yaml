name: discount_cold_store
description: "ثلاجة مخفض (رمز C) - نظام إدارة البالتات والراكات والإعدامات"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Modern Icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^1.2.0
  shimmer: ^3.0.0

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Backend (Supabase)
  supabase_flutter: ^2.8.0

  # Reports, PDF & Formatting
  pdf: ^3.11.1
  printing: ^5.13.3
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets (Images & Fonts for PDF offline loading if needed)
  assets:
    - assets/image/
    - assets/image/logo_blue.png
    - assets/image/logo_sq.png
    - assets/image/logo.png
    - assets/font/

  # Custom Cairo Font Family with all exact weights from assets/font/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/font/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Cairo-Light.ttf
          weight: 300
        - asset: assets/font/Cairo-Regular.ttf
          weight: 400
        - asset: assets/font/Cairo-Medium.ttf
          weight: 500
        - asset: assets/font/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/font/Cairo-Bold.ttf
          weight: 700
        - asset: assets/font/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Cairo-Black.ttf
          weight: 900