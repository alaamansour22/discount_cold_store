name: discount_cold_store
description: "ثلاجة المخفض (C)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Modern Icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^4.0.3
  shimmer: ^3.0.0

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Backend (Supabase)
  supabase_flutter: ^2.8.0

  # Reports, PDF & Formatting
  pdf: ^3.11.1
  printing: ^5.13.3
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  change_app_package_name: ^1.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/image/logo_sq.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/image/logo_sq.png"
  windows:
    generate: true
    image_path: "assets/image/logo_sq.png"
    icon_size: 48

flutter_native_splash:
  color: "#0F172A"
  image: "assets/image/splash_logo_safe.png"

  android_12:
    color: "#0F172A"
    image: "assets/image/splash_logo_safe.png"

  web: true

flutter:
  uses-material-design: true

  # Assets (Images & Fonts for PDF offline loading if needed)
  assets:
    - assets/image/
    - assets/image/logo_blue.png
    - assets/image/beyti_logo.jpg
    - assets/image/logo_sq.png
    - assets/image/logo.png
    - assets/font/

  # Custom Cairo Font Family with all exact weights from assets/font/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/font/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Cairo-Light.ttf
          weight: 300
        - asset: assets/font/Cairo-Regular.ttf
          weight: 400
        - asset: assets/font/Cairo-Medium.ttf
          weight: 500
        - asset: assets/font/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/font/Cairo-Bold.ttf
          weight: 700
        - asset: assets/font/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Cairo-Black.ttf
          weight: 900